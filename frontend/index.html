<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- interactive-widget: браузер сам сжимает вьюпорт под клавиатуру, и нижний
       лист с формой не уезжает под неё. Где не поддерживается (iOS Safari) —
       добирает useKeyboardInset через visualViewport. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="Онлайн-расписание и бронирование. Выберите удобную дату и запишитесь через Telegram." />
  <title>Онлайн-запись</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
