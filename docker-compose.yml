networks:
  shared-proxy:
    external: true

services:
  backend:
    build: ./backend
    container_name: reservation-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      # Расписание считается по Москве: «сегодня», отсечение прошедшего
      # времени и ночная очистка читают локальное время контейнера. Без TZ
      # он живёт в UTC, и клиенту три часа предлагались уже прошедшие слоты.
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shared-proxy
