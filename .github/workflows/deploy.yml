name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Два пуша подряд запускали две сборки образа на одной машине одновременно.
# Деплой не отменяем на середине — дожидаемся предыдущего.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build admin panel
        run: npm run build --workspace=admin
        env:
          VITE_METRIKA_COUNTER_ID: ${{ secrets.ADMIN_METRIKA_COUNTER_ID }}

      - name: Build landing
        run: npm run build:landing
        env:
          METRIKA_COUNTER_ID: ${{ secrets.LANDING_METRIKA_COUNTER_ID }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          # `docker-compose up --build` молчит по несколько минут, пока внутри
          # образа идёт npm install и компиляция better-sqlite3, и соединение
          # разрывалось с «client_loop: send disconnect: Broken pipe».
          # Раньше этот шаг всегда попадал в кеш слоя и потому был мгновенным.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          cat ~/.ssh/config

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='certbot/' \
            --exclude='frontend-dist/' \
            --exclude='admin-dist/' \
            --exclude='.git' \
            --exclude='backend/data/' \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Sync frontend build
        run: |
          rsync -avz --delete \
            frontend/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend-dist/

      - name: Sync admin build
        run: |
          rsync -avz --delete \
            admin/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/admin-dist/

      - name: Generate backend .env
        env:
          ENV_CONTENT: |
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            PORT=3000
            NODE_ENV=production
            FRONTEND_URL=https://slotik.tech
            ADMIN_URL=https://admin.slotik.tech
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MONITOR_BOT_TOKEN=${{ secrets.MONITOR_BOT_TOKEN }}
            VK_BOT_TOKEN=${{ secrets.VK_BOT_TOKEN }}
            VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
            CLIENTS_PASSWORD=${{ secrets.CLIENTS_PASSWORD }}
        run: |
          printf '%s' "$ENV_CONTENT" | ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cat > ${{ secrets.DEPLOY_PATH }}/backend/.env"

      - name: Backup database before restart
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s << 'BACKUP_SCRIPT'
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DB_FILE="$DEPLOY_PATH/data/reservations.db"
            BACKUP_DIR="$DEPLOY_PATH/data/backups"

            if [ -f "$DB_FILE" ]; then
              mkdir -p "$BACKUP_DIR"
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              cp "$DB_FILE" "$BACKUP_DIR/reservations-deploy-$TIMESTAMP.db"
              echo "Backup created: reservations-deploy-$TIMESTAMP.db"

              # Keep only last 10 deploy backups
              ls -1t "$BACKUP_DIR"/reservations-deploy-*.db 2>/dev/null | tail -n +11 | xargs -r rm -f
              echo "Backup rotation done"
            else
              echo "No database file found, skipping backup"
            fi
          BACKUP_SCRIPT

      - name: Restart containers
        timeout-minutes: 25
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker-compose up -d --build"

      # Проверяем не только /health, но и что запущен именно новый код:
      # предыдущий деплой упал на перезапуске, статика обновилась, а бэкенд
      # остался старым — и страница записи обращалась к несуществующим ручкам.
      - name: Health check
        run: |
          echo "Waiting for server to start..."
          for i in $(seq 1 20); do
            if curl -sf https://slotik.tech/health > /dev/null; then break; fi
            sleep 5
          done

          curl -sf https://slotik.tech/health || {
            echo "::error::/health не отвечает"
            exit 1
          }

          date=$(date -u +%Y-%m-%d)
          if ! curl -sf "https://slotik.tech/api/business/demo-banya/free-slots?date=$date" \
               | grep -q '"slots"'; then
            echo "::error::бэкенд отвечает, но без /free-slots — контейнер не обновился"
            exit 1
          fi
          echo "Backend is running the current build"
