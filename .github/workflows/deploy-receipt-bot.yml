name: Deploy receipt bot

on:
  push:
    branches: [master]
    paths:
      - 'receipt-bot/**'
      - '.github/workflows/deploy-receipt-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-receipt-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test receipt bot
        working-directory: receipt-bot
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -q

      - name: Deploy and verify on Germany-4
        env:
          RECEIPT_DEPLOY_SSH_KEY: ${{ secrets.RECEIPT_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'unlink "$ssh_dir/key"; unlink "$ssh_dir/config"; unlink "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "${RECEIPT_DEPLOY_SSH_KEY:?Missing receipt bot deploy key}" > "$ssh_dir/key"
          unset RECEIPT_DEPLOY_SSH_KEY
          cat > "$ssh_dir/known_hosts" <<'KNOWN_HOSTS'
          13.143.168.34 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOzdSeEtuGgjKM2Y+HR2dG20YDet1JL5Gzw9iCUNq3LD
          KNOWN_HOSTS
          cat > "$ssh_dir/config" <<SSH_CONFIG
          Host receipt-germany4
            HostName 13.143.168.34
            User root
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSH_CONFIG

          ssh -F "$ssh_dir/config" receipt-germany4 '
            test "$(hostname -s)" = s354509 &&
            test -s /opt/reservation-service/receipt-bot/.env &&
            test -s /opt/reservation-service/data/receipt-bot/receipts.sqlite3
          '
          rsync -az --delay-updates --delete-delay \
            --exclude='/.env' --exclude='/.venv/' --exclude='__pycache__/' \
            --exclude='/data/' --exclude='/receipt-examples/' \
            -e "ssh -F $ssh_dir/config" receipt-bot/ \
            receipt-germany4:/opt/reservation-service/receipt-bot/

          ssh -F "$ssh_dir/config" receipt-germany4 bash -s -- "$GITHUB_SHA" <<'DEPLOY'
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = s354509
          cd /opt/reservation-service
          export RECEIPT_BOT_REVISION="$1"

          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import sqlite3

          source = Path('data/receipt-bot/receipts.sqlite3').resolve(strict=True)
          backups = source.parent / 'backups'
          backups.mkdir(exist_ok=True)
          timestamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
          backup = backups / f'receipts-deploy-{timestamp}.sqlite3'
          with sqlite3.connect(f'{source.as_uri()}?mode=ro', uri=True) as current:
              with sqlite3.connect(backup) as snapshot:
                  current.backup(snapshot)
                  if snapshot.execute('PRAGMA quick_check').fetchone() != ('ok',):
                      raise SystemExit('Receipt database backup failed integrity check')
          for old in sorted(backups.glob('receipts-deploy-*.sqlite3'), reverse=True)[10:]:
              old.unlink()
          print('Receipt database backup verified')
          PYTHON

          DOCKER_BUILDKIT=0 docker build -t receipt-bot-bot receipt-bot
          docker compose -f receipt-bot/compose.yaml up -d --no-build --pull never bot
          container="$(docker compose -f receipt-bot/compose.yaml ps -q bot)"
          test -n "$container"
          for attempt in {1..20}; do
            if [[ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$container")" == 'true 0' ]] &&
               grep -Fq 'Бот @bratbuhbot подключён к Telegram' <<< "$(docker logs "$container" 2>&1)"; then
              test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")" = "$RECEIPT_BOT_REVISION"
              printf 'Germany-4 (%s): @bratbuhbot connected, revision %s\n' "$(hostname -s)" "$RECEIPT_BOT_REVISION"
              exit 0
            fi
            sleep 2
          done
          echo 'Receipt bot did not finish Telegram startup' >&2
          docker compose -f receipt-bot/compose.yaml ps -a
          exit 1
          DEPLOY

          printf 'Deployed `%s` to **Germany-4** (`s354509`).\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
