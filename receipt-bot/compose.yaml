services:
  bot:
    build: .
    image: receipt-bot-bot
    container_name: reservation-receipt-bot
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RECEIPT_BOT_REVISION:-local}
    env_file: .env
    environment:
      DB_PATH: /app/data/receipts.sqlite3
      TZ: Asia/Tomsk
      PYTHONUNBUFFERED: '1'
    volumes:
      - ../data/receipt-bot:/app/data
